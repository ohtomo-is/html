<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>テストページ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f5f1; --surface: #fff; --text: #1f2328; --muted: #5f6670;
      --line: #e3e1da; --accent: #2f6f62; --accent-soft: #e3efeb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181b; --surface: #1f2226; --text: #e9eaec; --muted: #a0a6ae;
        --line: #31353b; --accent: #7cc2b1; --accent-soft: #23332f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Noto Sans JP", system-ui, sans-serif; line-height: 1.8;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 56px 16px 80px; }
    h1 { font-size: 32px; line-height: 1.3; margin: 0 0 12px; }
    .desc { color: var(--muted); margin: 0 0 32px; }
    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 12px; padding: 20px 24px;
    }
    .card h2 { font-size: 16px; margin: 0 0 12px; color: var(--accent); }
    ul.checks { list-style: none; margin: 0; padding: 0; }
    ul.checks li {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 10px 0; border-bottom: 1px dashed var(--line);
    }
    ul.checks li:last-child { border-bottom: 0; }
    ul.checks li::before {
      content: "✓"; flex: none; width: 24px; height: 24px; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent);
      display: grid; place-items: center; font-size: 13px; font-weight: 700; margin-top: 3px;
    }
    footer { margin-top: 48px; text-align: center; color: var(--muted); font-size: 13px; }
    @media (max-width: 560px) { h1 { font-size: 26px; } .card { padding: 16px 18px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>テストページ</h1>
    <p class="desc">これはHTML作成の動作確認用ページです。</p>

    <section class="card">
      <h2>確認項目</h2>
      <ul class="checks">
        <li>GitHub連携の確認</li>
        <li>HTML出力の確認</li>
        <li>表示崩れがないかチェック</li>
      </ul>
    </section>

    <footer>GitHub Issue #1 をもとに作成</footer>
  </main>
</body>
</html>
